name: QA E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

defaults:
  run:
    working-directory: qa/07-automation/e2e

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qa/07-automation/e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Run E2E tests
        env:
          # Target the isolated QA stack (see qa/README.md). Overridable via repo vars.
          QA_BASE_URL: ${{ vars.QA_BASE_URL || 'https://unicornt-qa.keber.cl' }}
          QA_API_URL: ${{ vars.QA_API_URL || 'https://api-unicornt-qa.keber.cl' }}
          CI: true
        run: npx playwright test --project=chromium --reporter=list,html

      - name: Upload Playwright report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: qa/07-automation/e2e/playwright-report/
          retention-days: 14

      # NOTE: code-coverage collection + publish is PARKED since the 2026-09-06 Vite migration
      # (minified bundles, no sourcemaps, frontend build not in this repo). See
      # qa/AGENT-NEXT-STEPS.md for the restore steps.

      # Only the report from main gets published as the public GitHub Pages
      # site - PR/branch runs still get the artifact above, not a live URL.
      - name: Assemble Pages site (test report)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p pages-site
          [ -d playwright-report ] && cp -r playwright-report/. pages-site/ || true

      - name: Upload site for GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: qa/07-automation/e2e/pages-site/

  publish-report:
    name: Publish report to GitHub Pages
    needs: e2e
    if: always() && needs.e2e.result != 'cancelled' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
